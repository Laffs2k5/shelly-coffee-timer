<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Shelly Coffee Timer</title>
<link rel="icon" href="favicon.ico" type="image/x-icon">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: #1a1a1a;
  color: #e0e0e0;
  padding: 16px;
  max-width: 480px;
  margin: 0 auto;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* --- Cards --- */
.card {
  background: #2a2a2a;
  border: 1px solid #444444;
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 12px;
}

/* --- Section headings --- */
.card-title {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  color: #90CAF9;
  margin-bottom: 12px;
  font-weight: 600;
}

/* --- Status display --- */
.status-line {
  font-size: 28px;
  font-weight: 700;
  padding: 8px 0 4px;
  transition: color 0.4s ease, font-size 0.3s ease;
}
.status-on {
  color: #4CAF50;
  font-size: 32px;
}
.status-off {
  color: #888888;
  font-size: 24px;
}
.status-error {
  color: #f44336;
  font-size: 22px;
}
.mode-tag {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  background: rgba(144, 202, 249, 0.15);
  color: #90CAF9;
  padding: 3px 10px;
  border-radius: 12px;
  margin-left: 8px;
  vertical-align: middle;
}
.ack-line {
  font-size: 13px;
  color: #888888;
  padding: 2px 0 8px;
  min-height: 22px;
}

/* --- Buttons --- */
.btn-row {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
}
.btn {
  padding: 16px 0;
  font-size: 16px;
  font-weight: 700;
  border: 1px solid #444444;
  border-radius: 10px;
  background: #333333;
  color: #e0e0e0;
  cursor: pointer;
  text-align: center;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  transition: background 0.15s ease, border-color 0.15s ease, transform 0.1s ease;
  min-height: 52px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.btn:hover {
  background: #3a3a3a;
}
.btn:active {
  background: #444444;
  transform: scale(0.96);
}
.btn-off {
  border-color: #888888;
  color: #888888;
}
.btn-off:hover {
  border-color: #999999;
  background: rgba(136, 136, 136, 0.15);
}
.btn-on {
  border-color: #4CAF50;
  color: #4CAF50;
}
.btn-on:hover {
  background: rgba(76, 175, 80, 0.12);
}
.btn-on:active {
  background: rgba(76, 175, 80, 0.25);
}

/* --- Schedule section --- */
.schedule-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 6px 0;
}
.schedule-row label {
  font-size: 15px;
  color: #e0e0e0;
}
.toggle {
  position: relative;
  width: 50px;
  height: 28px;
  cursor: pointer;
  flex-shrink: 0;
}
.toggle input { display: none; }
.toggle-slider {
  position: absolute;
  inset: 0;
  background: #555555;
  border-radius: 14px;
  transition: background 0.25s ease;
}
.toggle-slider::after {
  content: "";
  position: absolute;
  width: 22px;
  height: 22px;
  left: 3px;
  top: 3px;
  background: #ccc;
  border-radius: 50%;
  transition: transform 0.25s ease, background 0.25s ease;
}
.toggle input:checked + .toggle-slider { background: #4CAF50; }
.toggle input:checked + .toggle-slider::after {
  transform: translateX(22px);
  background: #ffffff;
}

.schedule-divider {
  border: none;
  border-top: 1px solid #3a3a3a;
  margin: 4px 0;
}

.time-picker {
  display: flex;
  align-items: center;
  gap: 6px;
}
.time-input {
  width: 52px;
  padding: 8px 4px;
  font-size: 18px;
  font-weight: 600;
  text-align: center;
  background: #1a1a1a;
  color: #e0e0e0;
  border: 1px solid #444444;
  border-radius: 8px;
  transition: border-color 0.2s ease;
  -moz-appearance: textfield;
}
.time-input::-webkit-outer-spin-button,
.time-input::-webkit-inner-spin-button {
  -webkit-appearance: none;
  margin: 0;
}
.time-input:focus {
  outline: none;
  border-color: #90CAF9;
}
.time-sep {
  font-size: 20px;
  font-weight: bold;
  color: #888888;
}
.time-btn {
  padding: 8px 16px;
  font-size: 13px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  background: rgba(144, 202, 249, 0.12);
  color: #90CAF9;
  border: 1px solid rgba(144, 202, 249, 0.3);
  border-radius: 8px;
  cursor: pointer;
  transition: background 0.15s ease;
}
.time-btn:hover {
  background: rgba(144, 202, 249, 0.2);
}
.time-btn:active {
  background: rgba(144, 202, 249, 0.3);
}

/* --- Connection footer --- */
.conn-footer {
  margin-top: auto;
  padding-top: 16px;
}
.conn-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 0;
  font-size: 12px;
  color: #666666;
}
.conn-dot {
  display: inline-block;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  margin-right: 6px;
  transition: background 0.4s ease;
}
.conn-ok { background: #FFC107; }
.conn-err { background: #f44336; }
.last-update {
  font-size: 11px;
  color: #555555;
}

/* --- Settings button --- */
.settings-btn {
  position: fixed;
  top: 12px;
  right: 12px;
  background: #2a2a2a;
  border: 1px solid #444444;
  color: #888888;
  font-size: 18px;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.15s ease, color 0.15s ease;
  z-index: 50;
}
.settings-btn:hover {
  background: #333333;
  color: #e0e0e0;
}
.settings-btn:active {
  background: #444444;
}

/* --- Modal overlay --- */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.75);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  z-index: 100;
  justify-content: center;
  align-items: center;
  opacity: 0;
  transition: opacity 0.2s ease;
}
.modal-overlay.open {
  display: flex;
  opacity: 1;
}
.modal {
  background: #2a2a2a;
  border: 1px solid #444444;
  border-radius: 16px;
  padding: 24px;
  width: 90%;
  max-width: 360px;
  box-shadow: 0 16px 48px rgba(0, 0, 0, 0.4);
  transform: translateY(10px);
  transition: transform 0.2s ease;
}
.modal-overlay.open .modal {
  transform: translateY(0);
}
.modal h3 {
  margin-bottom: 16px;
  font-size: 17px;
  font-weight: 700;
  color: #e0e0e0;
}
.modal label {
  display: block;
  font-size: 12px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: #888888;
  margin: 12px 0 6px;
}
.modal input[type="text"],
.modal input[type="password"] {
  width: 100%;
  padding: 10px 12px;
  font-size: 14px;
  background: #1a1a1a;
  color: #e0e0e0;
  border: 1px solid #444444;
  border-radius: 8px;
  transition: border-color 0.2s ease;
}
.modal input[type="text"]:focus,
.modal input[type="password"]:focus {
  outline: none;
  border-color: #90CAF9;
}
.modal-btns {
  display: flex;
  gap: 8px;
  margin-top: 20px;
  justify-content: flex-end;
}
.modal-btns button {
  padding: 10px 20px;
  font-size: 14px;
  font-weight: 600;
  border: 1px solid #444444;
  border-radius: 8px;
  cursor: pointer;
  background: #333333;
  color: #e0e0e0;
  transition: background 0.15s ease;
}
.modal-btns button:hover {
  background: #3a3a3a;
}
.modal-btns button.primary {
  background: #4CAF50;
  color: #ffffff;
  border-color: #4CAF50;
}
.modal-btns button.primary:hover {
  background: #43a047;
}
.modal-btns button:active {
  opacity: 0.8;
}
</style>
</head>
<body>

<button class="settings-btn" onclick="openSettings()">&#9881;</button>

<div class="card">
  <div class="card-title">Manual control</div>
  <div id="status" class="status-line status-off">--</div>
  <div id="ack" class="ack-line"></div>
  <div class="btn-row">
    <button class="btn btn-off" onclick="sendCmd('off')">OFF</button>
    <button class="btn" onclick="sendCmd('sub')">&minus;30</button>
    <button class="btn" onclick="sendCmd('ext')">+30</button>
    <button class="btn btn-on" onclick="sendCmd('t90')">90</button>
  </div>
</div>

<div class="card">
  <div class="card-title">Schedule</div>
  <div class="schedule-row">
    <label>Schedule enabled</label>
    <label class="toggle">
      <input type="checkbox" id="schToggle" onchange="saveSchedule()">
      <span class="toggle-slider"></span>
    </label>
  </div>
  <hr class="schedule-divider">
  <div class="schedule-row">
    <label>Wake-up time</label>
    <div class="time-picker">
      <input type="number" id="schH" class="time-input" min="0" max="23" value="6">
      <span class="time-sep">:</span>
      <input type="number" id="schM" class="time-input" min="0" max="59" value="0" step="5">
      <button class="time-btn" onclick="saveSchedule()">Set</button>
    </div>
  </div>
</div>

<div class="conn-footer">
  <div class="conn-bar">
    <span><span id="connDot" class="conn-dot conn-err"></span><span id="connText">Not connected</span></span>
    <span id="lastUpdate" class="last-update"></span>
  </div>
</div>

<!-- Settings modal -->
<div id="settingsModal" class="modal-overlay">
  <div class="modal">
    <h3>Cloud MQTT credentials</h3>
    <p style="margin:0 0 12px;font-size:0.85em;opacity:0.7;">Escape hatch — uses your phone's cloud MQTT username/password. Stored only in this browser, never sent anywhere else.</p>
    <label for="inputUser">MQTT username</label>
    <input type="text" id="inputUser" autocapitalize="none" autocorrect="off">
    <label for="inputKey">MQTT password</label>
    <input type="password" id="inputKey">
    <label for="inputHost">Broker host (optional)</label>
    <input type="text" id="inputHost" autocapitalize="none" autocorrect="off" placeholder="default EMQX endpoint">
    <label for="inputDevice">Device ID</label>
    <input type="text" id="inputDevice" autocapitalize="none" autocorrect="off" placeholder="e.g. shellyplug-xxxxxx">
    <div class="modal-btns">
      <button onclick="closeSettings()">Cancel</button>
      <button class="primary" onclick="saveCreds()">Save</button>
    </div>
  </div>
</div>

<!-- MQTT over WebSocket client (pinned). Browser supplies TLS + ALPN that EMQX Serverless requires. -->
<script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script src="coffee-core.js"></script>
<script>
(function() {
  "use strict";

  // --- Credential management (cloud MQTT user/pass; reuses the phone's YOUR_PHONE_ID creds) ---
  var LS = { user: "mqtt_user", pass: "mqtt_pass", host: "mqtt_host", device: "mqtt_device" };
  var user = localStorage.getItem(LS.user) || "";
  var pass = localStorage.getItem(LS.pass) || "";
  var host = localStorage.getItem(LS.host) || CoffeeCore.DEFAULT_HOST;
  var device = localStorage.getItem(LS.device) || CoffeeCore.DEVICE;
  var T = CoffeeCore.topics(device);
  var client = null;
  var currentConfig = null; // cached retained config for read-modify-write

  function hasCreds() { return user && pass; }

  window.openSettings = function() {
    document.getElementById("inputUser").value = user;
    document.getElementById("inputKey").value = pass;
    document.getElementById("inputHost").value = localStorage.getItem(LS.host) || "";
    document.getElementById("inputDevice").value = localStorage.getItem(LS.device) || "";
    document.getElementById("settingsModal").classList.add("open");
  };

  window.closeSettings = function() {
    document.getElementById("settingsModal").classList.remove("open");
  };

  // Close modal on overlay click
  document.getElementById("settingsModal").addEventListener("click", function(e) {
    if (e.target === this) closeSettings();
  });

  window.saveCreds = function() {
    var u = document.getElementById("inputUser").value.trim();
    var p = document.getElementById("inputKey").value.trim();
    var h = document.getElementById("inputHost").value.trim();
    var d = document.getElementById("inputDevice").value.trim();
    if (!u || !p) { alert("Username and password are required."); return; }
    user = u; pass = p;
    localStorage.setItem(LS.user, u);
    localStorage.setItem(LS.pass, p);
    if (h) { localStorage.setItem(LS.host, h); host = h; }
    else { localStorage.removeItem(LS.host); host = CoffeeCore.DEFAULT_HOST; }
    if (d) { localStorage.setItem(LS.device, d); device = d; }
    else { localStorage.removeItem(LS.device); device = CoffeeCore.DEVICE; }
    T = CoffeeCore.topics(device);
    closeSettings();
    reconnect();
  };

  // Prompt on first load if no creds
  if (!hasCreds()) {
    setTimeout(function() { openSettings(); }, 200);
  }

  // --- Status display ---
  function setStatus(text, cls) {
    var el = document.getElementById("status");
    el.textContent = text;
    el.className = "status-line " + cls;
  }

  function setAck(text) {
    document.getElementById("ack").textContent = text;
  }

  function setConn(ok, text) {
    document.getElementById("connDot").className = "conn-dot " + (ok ? "conn-ok" : "conn-err");
    document.getElementById("connText").textContent = text;
    if (ok) {
      document.getElementById("lastUpdate").textContent =
        "Updated " + new Date().toLocaleTimeString([], {hour12: false});
    }
  }

  function pad2(n) { return String(n).padStart(2, "0"); }

  // Render a retained heartbeat into the UI (parsing logic lives in coffee-core.js).
  function applyHeartbeat(s) {
    var m = CoffeeCore.parseHeartbeat(s);
    if (!m) return;
    setStatus(m.statusText, m.state === "on" ? "status-on" : "status-off");
    setAck(m.ackText);
    if (m.sch !== null) document.getElementById("schToggle").checked = m.sch === 1;
    if (m.h !== null) document.getElementById("schH").value = pad2(m.h);
    if (m.m !== null) document.getElementById("schM").value = pad2(m.m);
  }

  function applyConfig(cfg) {
    if (typeof cfg.sch !== "undefined") document.getElementById("schToggle").checked = cfg.sch === 1;
    if (typeof cfg.h !== "undefined") document.getElementById("schH").value = pad2(cfg.h);
    if (typeof cfg.m !== "undefined") document.getElementById("schM").value = pad2(cfg.m);
  }

  // --- MQTT (cloud-only escape hatch over WSS; see docs/spec/11 §10) ---
  function disconnect() {
    if (client) { try { client.end(true); } catch (e) {} client = null; }
  }
  function reconnect() { disconnect(); connect(); }

  function connect() {
    if (!hasCreds()) return;
    if (typeof mqtt === "undefined") { setConn(false, "MQTT library failed to load"); return; }
    setConn(false, "Connecting...");
    client = mqtt.connect(CoffeeCore.brokerUrl(host), {
      username: user,
      password: pass,
      clean: true,
      reconnectPeriod: 4000,
      connectTimeout: 8000,
      // Distinct client id so we never take over the phone's session (YOUR_PHONE_ID).
      clientId: "webfallback-" + Math.random().toString(16).slice(2, 10)
    });
    client.on("connect", function() {
      setConn(true, "Cloud MQTT");
      client.subscribe(T.heartbeat, { qos: 1 });
      client.subscribe(T.config, { qos: 1 });
    });
    client.on("message", function(topic, payload) {
      var s = payload.toString();
      if (topic === T.heartbeat) {
        applyHeartbeat(s);
        setConn(true, "Cloud MQTT");
      } else if (topic === T.config) {
        try { currentConfig = JSON.parse(s); applyConfig(currentConfig); } catch (e) {}
      }
    });
    client.on("reconnect", function() { setConn(false, "Reconnecting..."); });
    client.on("offline", function() { setConn(false, "Offline"); });
    client.on("error", function(e) { setConn(false, "MQTT error: " + (e && e.message ? e.message : e)); });
  }

  // --- Commands ---
  window.sendCmd = function(cmd) {
    if (!hasCreds()) { openSettings(); return; }
    if (!client || !client.connected) { alert("Not connected to the broker yet."); return; }
    var payload = CoffeeCore.buildCommand(cmd, Math.floor(Date.now() / 1000));
    client.publish(T.command, payload, { qos: 1, retain: false });
  };

  // --- Schedule (read-modify-write of the retained config) ---
  window.saveSchedule = function() {
    if (!hasCreds()) { openSettings(); return; }
    if (!client || !client.connected) { alert("Not connected to the broker yet."); return; }
    var ui = {
      sch: document.getElementById("schToggle").checked,
      h: document.getElementById("schH").value,
      m: document.getElementById("schM").value
    };
    var newCfg = CoffeeCore.buildConfig(currentConfig, ui);
    client.publish(T.config, JSON.stringify(newCfg), { qos: 1, retain: true });
    currentConfig = newCfg;
  };

  // --- Init ---
  if (hasCreds()) connect();

  // Reconnect when the page becomes visible again, if the link dropped.
  document.addEventListener("visibilitychange", function() {
    if (!document.hidden && hasCreds() && (!client || !client.connected)) reconnect();
  });
})();
</script>
</body>
</html>
